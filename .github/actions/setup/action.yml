name: "Setup (pnpm + node + install)"
description: "Install pnpm, set up Node from .node-version with the pnpm cache, then install deps with a frozen lockfile."

# checkout is intentionally NOT here — a local `uses: ./.github/actions/...` needs the
# repo already checked out, so each calling job keeps `actions/checkout` as its first step.
#
# Remote actions are SHA-pinned with an exact `# vX.Y.Z` — see the pinning rule in `ci.yml`.
runs:
  using: "composite"
  steps:
    - name: Install pnpm
      # v6.1.0 is the first release that supports pnpm 12, so this pin must not fall below it.
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # pnpm must be set up before setup-node so `cache: "pnpm"` can locate the store.
    - name: Node setup
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
