name: "Supabase stack (trimmed)"
description: "Run the lockfile's Supabase CLI (./.github/actions/setup must run first), regenerate the seed, boot a trimmed local stack, and export its env to $GITHUB_ENV."

# A remote action added to this file is SHA-pinned with an exact `# vX.Y.Z` — see the pinning rule
# in `ci.yml`. None is used today: the CLI comes from the lockfile.
runs:
  using: "composite"
  steps:
    # The CLI is the one `pnpm-lock.yaml` resolves, run through `pnpm exec`, so whatever moves
    # `supabase` in the lockfile moves CI — and the stack's images, which are that CLI's defaults —
    # in the same commit. `supabase/setup-cli` was dropped: v3.0.1 finds the version by parsing the
    # lockfile as ONE YAML document, pnpm 12 writes two, and the action fell back to `latest` without
    # a word, so CI ran whatever CLI shipped last. This step reads the installed package's version
    # (the lockfile's, under `--frozen-lockfile`) and fails unless that is the binary answering.
    #
    # Precondition: `./.github/actions/setup` runs earlier in the job — it is what puts the CLI in
    # `node_modules`.
    - name: Supabase CLI (the lockfile's)
      shell: bash
      run: |
        pkg=node_modules/supabase/package.json
        if [ ! -f "$pkg" ]; then
          echo "$pkg is missing: run ./.github/actions/setup before this action" >&2
          exit 1
        fi
        expected="$(node -p "require('./$pkg').version")"
        actual="$(pnpm exec supabase --version)"
        if [ "$actual" != "$expected" ]; then
          echo "expected Supabase CLI $expected (lockfile), but 'pnpm exec supabase' answered '$actual'" >&2
          exit 1
        fi
        echo "Supabase CLI $actual (lockfile)"

    # Regenerate the catalog seed so `supabase start` loads a current seed.sql.
    - name: Regenerate seed
      shell: bash
      run: node scripts/gen-seed.mjs > supabase/seed.sql

    # Trimmed stack: keep postgres + postgrest + kong (the supabase-js path) and
    # gotrue (cheap; future RLS/e2e). Exclude everything else to cut boot time.
    # Container names are the CLI's own labels (mailpit/storage-api/logflare/
    # postgres-meta), not the docs' aliases — the CLI rejects inbucket/storage/etc.
    - name: Start Supabase (trimmed stack)
      shell: bash
      run: pnpm exec supabase start -x studio,imgproxy,mailpit,realtime,storage-api,vector,logflare,edge-runtime,postgres-meta,supavisor

    # Export the stack's env to the job, for both lanes' solver, the integration / e2e suites and
    # the load-test-env CI fail-gate. The keys are the CLI's fixed defaults, not minted per stack,
    # and they go out in the formats production uses: SUPABASE_KEY is the publishable key
    # (`sb_publishable_…`), and SUPABASE_SERVICE_ROLE_KEY carries the secret key (`sb_secret_…`)
    # under its historical name. The deprecated HS256 `anon_key` / `service_role_key` fields are
    # not exported.
    #
    # `status` drops an unknown `--override-name` path without an error (exit 0, no variable), so a
    # typo here surfaces only as a missing variable much later — hence "Assert Supabase env" below.
    #
    # `status -o env` prints EVERY field, not just the overridden ones: the legacy JWTs as ANON_KEY /
    # SERVICE_ROLE_KEY, JWT_SECRET, the S3 keys. The grep keeps exactly the four names, so no legacy
    # key reaches the job env under any name — a later step reaching for SERVICE_ROLE_KEY gets
    # nothing rather than, quietly, the JWT. Under `pipefail` a grep matching nothing fails the step.
    #
    # `status -o env` quotes its values (SUPABASE_URL="http://..."); $GITHUB_ENV keeps quotes
    # literal, which supabase-js rejects as an invalid URL — strip them before appending.
    # `SUPABASE_DB_URL` is the direct Postgres endpoint the grant-posture suite needs:
    # `has_table_privilege` is catalog introspection, which PostgREST cannot express at all — and
    # reading a migration's revoke statements is explicitly NOT proof (lessons.md). The CLI's local
    # port is fixed, so this matches the local default; exporting it keeps CI explicit rather than
    # lucky.
    #
    # Env isolation (e2e ↔ deploy): these vars come SOLELY from this job's own ephemeral
    # stack. Never reference `${{ secrets.SUPABASE_* }}` here (those are the hosted/
    # production project, used only by `deploy`) and never promote SUPABASE_* to a
    # workflow-level `env:` block — writing a production key into `.dev.vars` would aim
    # the workerd preview, and a real signInWithPassword, at production. $GITHUB_ENV is
    # per-job, so these stay job-scoped.
    #
    # The action takes no inputs. One added later reaches a script through `env:`, never as `${{ }}`
    # inside `run:`: an expression there is pasted into the script text before bash parses it, so a
    # non-literal value from a caller would execute as code. No `run:` in either composite action
    # interpolates one.
    - name: Export Supabase env
      shell: bash
      run: |
        pnpm exec supabase status -o env \
          --override-name api.url=SUPABASE_URL \
          --override-name auth.publishable_key=SUPABASE_KEY \
          --override-name auth.secret_key=SUPABASE_SERVICE_ROLE_KEY \
          --override-name db.url=SUPABASE_DB_URL \
          | sed 's/"//g' \
          | grep -E '^(SUPABASE_URL|SUPABASE_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_URL)=' \
          >> "$GITHUB_ENV"

    # The gate on the export, ahead of everything that consumes it — both lanes' solver boots on
    # these values before any test runs. All four must be set, and both keys must carry production's
    # prefix. It collects every failure and exits once, so a single run names every problem. It
    # prints names, lengths and the expected prefix, never a character of a value, even though these
    # local keys are public CLI defaults.
    #
    # It has to be its own step: a value appended to $GITHUB_ENV reaches only LATER steps, embedded
    # composite steps included.
    - name: Assert Supabase env
      shell: bash
      run: |
        # NAME=required-prefix; an empty prefix only requires a value.
        expectations=(
          "SUPABASE_URL="
          "SUPABASE_KEY=sb_publishable_"
          "SUPABASE_SERVICE_ROLE_KEY=sb_secret_"
          "SUPABASE_DB_URL="
        )
        failures=()
        report=()
        for expectation in "${expectations[@]}"; do
          name="${expectation%%=*}"
          prefix="${expectation#*=}"
          value="${!name:-}"
          if [ -z "$value" ]; then
            failures+=("$name: expected a value, found none")
          elif [[ "$value" != "$prefix"* ]]; then
            failures+=("$name: expected the $prefix prefix")
          else
            report+=("$name: ${prefix:-set}, ${#value} chars")
          fi
        done
        if [ "${#failures[@]}" -gt 0 ]; then
          printf '%s\n' "${failures[@]}" >&2
          exit 1
        fi
        printf '%s\n' "${report[@]}"
