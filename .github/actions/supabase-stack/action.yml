name: "Supabase stack (trimmed)"
description: "Install the Supabase CLI, regenerate the seed, boot a trimmed local stack, and export its minted keys to $GITHUB_ENV."

inputs:
  export-anon-key:
    description: "When 'true', also export the stack's anon key as SUPABASE_KEY (the e2e lane writes it into .dev.vars and uses it for signInWithPassword)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Supabase CLI
      uses: supabase/setup-cli@v2

    # Regenerate the catalog seed so `supabase start` loads a current seed.sql.
    - name: Regenerate seed
      shell: bash
      run: node scripts/gen-seed.mjs > supabase/seed.sql

    # Trimmed stack: keep postgres + postgrest + kong (the supabase-js path) and
    # gotrue (cheap; future RLS/e2e). Exclude everything else to cut boot time.
    # Container names are the CLI's own labels (mailpit/storage-api/logflare/
    # postgres-meta), not the docs' aliases — the CLI rejects inbucket/storage/etc.
    - name: Start Supabase (trimmed stack)
      shell: bash
      run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,vector,logflare,edge-runtime,postgres-meta,supavisor

    # The local stack mints its own keys; export them to the job env so the integration
    # / e2e suites and the load-test-env CI fail-gate find them. `status -o env` quotes
    # its values (SUPABASE_URL="http://..."); $GITHUB_ENV keeps quotes literal, which
    # supabase-js rejects as an invalid URL — strip them before appending. The e2e lane
    # additionally needs the anon key (SUPABASE_KEY) for `.dev.vars` + signInWithPassword,
    # toggled via the `export-anon-key` input.
    #
    # Env isolation (e2e ↔ deploy): these vars come SOLELY from this job's own ephemeral
    # stack. Never reference `${{ secrets.SUPABASE_* }}` here (those are the hosted/
    # production project, used only by `deploy`) and never promote SUPABASE_* to a
    # workflow-level `env:` block — writing a production key into `.dev.vars` would aim
    # the workerd preview, and a real signInWithPassword, at production. $GITHUB_ENV is
    # per-job, so these stay job-scoped.
    - name: Export Supabase env
      shell: bash
      run: |
        EXTRA=""
        [ "${{ inputs.export-anon-key }}" = "true" ] && EXTRA="--override-name auth.anon_key=SUPABASE_KEY"
        supabase status -o env \
          --override-name api.url=SUPABASE_URL $EXTRA \
          --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
          | sed 's/"//g' >> "$GITHUB_ENV"
