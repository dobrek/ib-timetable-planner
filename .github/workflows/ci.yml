name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpx astro sync
      - run: pnpm run lint
      - run: pnpm run steiger
      - run: pnpm run test
      - run: pnpm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2

      # Regenerate the catalog seed so `supabase start` loads a current seed.sql.
      - run: node scripts/gen-seed.mjs > supabase/seed.sql

      # Trimmed stack: keep postgres + postgrest + kong (the supabase-js path) and
      # gotrue (cheap; future RLS/e2e). Exclude everything else to cut boot time.
      # Container names are the CLI's own labels (mailpit/storage-api/logflare/
      # postgres-meta), not the docs' aliases — the CLI rejects inbucket/storage/etc.
      - name: Start Supabase (trimmed stack)
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,vector,logflare,edge-runtime,postgres-meta,supavisor

      # The local stack mints its own keys; export them to the job env so the
      # integration suites and the load-test-env CI fail-gate find them. `status -o env`
      # quotes its values (SUPABASE_URL="http://..."); $GITHUB_ENV keeps quotes literal,
      # which supabase-js rejects as an invalid URL — strip them before appending.
      - name: Export Supabase env
        run: supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | sed 's/"//g' >> "$GITHUB_ENV"

      # Plan-rooted isolation (Phase 3) makes the lane DATA-safe under parallelism:
      # every suite owns a fresh plan and tears it down, reading no shared seed state.
      # `--maxWorkers=2` is a separate, RESOURCE concern: nine suites hammering the
      # trimmed stack on a constrained runner intermittently drew transient Kong/
      # PostgREST 502s ("invalid response from upstream server"). Capping concurrent
      # files keeps real parallelism while staying under that ceiling. CI-only — local
      # `pnpm test:integration` runs unconstrained.
      - run: pnpm test:integration --maxWorkers=2

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2

      # Regenerate the catalog seed so `supabase start` loads a current seed.sql.
      - run: node scripts/gen-seed.mjs > supabase/seed.sql

      # Same trimmed stack as the integration job — gotrue is retained (the e2e
      # author signs in through it), so no `-x` exclusion change is needed here.
      - name: Start Supabase (trimmed stack)
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,vector,logflare,edge-runtime,postgres-meta,supavisor

      # Export the ephemeral local stack's minted keys to THIS job's env only.
      # The e2e lane needs three values: SUPABASE_URL + the anon key (SUPABASE_KEY,
      # written into `.dev.vars` for the workerd preview) and the service-role key
      # (the `pretest:e2e` provisioning hook bypasses `enable_signup=false` with it).
      # `status -o env` quotes its values; $GITHUB_ENV keeps quotes literal, which
      # supabase-js rejects as an invalid URL — strip them before appending.
      #
      # Env isolation (e2e ↔ deploy): these vars come SOLELY from this job's own
      # ephemeral stack. Never reference `${{ secrets.SUPABASE_* }}` here (those are
      # the hosted/production project, used only by `deploy`) and never promote
      # SUPABASE_* to a workflow-level `env:` block — writing a production key into
      # `.dev.vars` would aim the workerd preview, and a real signInWithPassword, at
      # production. $GITHUB_ENV is per-job, so these stay job-scoped.
      - name: Export Supabase env
        run: supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.anon_key=SUPABASE_KEY --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY | sed 's/"//g' >> "$GITHUB_ENV"

      # The workerd preview reads SUPABASE_URL/SUPABASE_KEY from `.dev.vars`, NOT from
      # `webServer.env` — and the CI stack mints its own anon key that won't match the
      # fixed local publishable key, so we must write `.dev.vars` from the minted keys
      # before the server boots. Unquoted KEY=value, matching `pnpm env:local` output.
      - name: Write .dev.vars for the workerd preview
        run: printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .dev.vars

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `pretest:e2e` provisions the author (URL + service-role from $GITHUB_ENV) and
      # `test:e2e`'s webServer runs `pnpm build && pnpm preview` on real workerd.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [ci, integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpx astro sync
      - run: pnpm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Schema first, then code: migrations are additive by convention, so the
      # live Worker keeps running against the new schema while the deploy finishes.
      - name: Apply Supabase migrations
        run: |
          pnpm exec supabase link --project-ref hwmuiymhjgewtymymbmb
          pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
