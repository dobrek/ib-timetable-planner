name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes/queue time, but never
# cancel an in-flight `main` run mid-deploy (the guard evaluates false on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: "Lint, audit, unit & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm astro sync
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm steiger
      - run: pnpm audit --audit-level=high
      - run: pnpm test
      - run: pnpm build

  integration:
    name: "Integration tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # The solver-credential guard signs in as the machine user with the PUBLISHABLE key — that is
      # its subject (what a client holding only that key and a password can reach), so it needs the
      # stack's anon key exported. The suite throws in CI if it is missing rather than skipping.
      - uses: ./.github/actions/supabase-stack
        with:
          export-anon-key: "true"

      # --- the CP-SAT solver service (F-302 proof-of-life) ------------------------------------
      # `solver-transport.integration.test.ts` drives a real job row `queued -> running ->
      # succeeded` through the actual service, over the actual credential path. That is the ONE
      # test in this change that can tell a correct write from a merely-well-formed one, so it
      # runs on every push rather than "when someone remembers" — the POC's recorded lesson.
      #
      # Env isolation holds exactly as it does for the stack itself: the password is minted per
      # run, the URL and keys come from this job's own ephemeral stack, and no repo secret is
      # readable here. Pointing this at production is precisely what that separation prevents.
      - name: Provision the solver machine user
        run: |
          SOLVER_MACHINE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SOLVER_MACHINE_PASSWORD"
          echo "SOLVER_MACHINE_PASSWORD=$SOLVER_MACHINE_PASSWORD" >> "$GITHUB_ENV"
          SOLVER_MACHINE_PASSWORD="$SOLVER_MACHINE_PASSWORD" node scripts/provision-solver-user.mjs

      # Same EXACT pin caveat as the `solver` job: astral-sh/setup-uv publishes moving major tags
      # only up to v7, so `@v9` does not resolve. Bump deliberately; do not "tidy" to a bare major.
      # `version` pins the RESOLVER, and must move with `mise.toml`'s `uv = "..."` — see there.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          working-directory: services/solver
      - run: uv sync --locked
        working-directory: services/solver

      # Background service + a HEALTH POLL, not a sleep: a fixed sleep is either flaky or slow, and
      # it cannot tell "still booting" from "died on startup". Output goes to a file so the
      # `if: failure()` step below can surface it — without that, a service that dies mid-suite
      # reduces to a bare vitest poll timeout with zero explanation, which is the silent-failure
      # class this change avoids everywhere else.
      #
      # `SOLVER_MAX_CONCURRENT_JOBS` is sized to `--maxWorkers=2` below, and the two numbers must
      # move together. The service defaults to 1 and answers 503 past the cap — right for production,
      # where one container solves one ~12-minute job — but this lane now has TWO suites that
      # dispatch (`solver-transport` and `generation-proposal`), and under two workers they race.
      # Whichever loses gets a 503 that is a correct answer to the wrong question: the cap is a
      # capacity contract, not a queue, so the fix is to size it to the concurrency rather than to
      # retry around it or to serialize the suites. Both fixtures solve in ~1 s.
      - name: Start the solver service
        working-directory: services/solver
        env:
          SOLVER_MAX_CONCURRENT_JOBS: "2"
        run: |
          uv run uvicorn cpsat_service.app:app --port 8000 > "$RUNNER_TEMP/solver.log" 2>&1 &
          SOLVER_PID=$!
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "SOLVER_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
              echo "solver service is up"
              exit 0
            fi
            if ! kill -0 "$SOLVER_PID" 2>/dev/null; then
              echo "solver service died during startup"; cat "$RUNNER_TEMP/solver.log"; exit 1
            fi
            sleep 1
          done
          echo "solver service never answered /health"; cat "$RUNNER_TEMP/solver.log"; exit 1

      # Plan-rooted isolation (Phase 3) makes the lane DATA-safe under parallelism:
      # every suite owns a fresh plan and tears it down, reading no shared seed state.
      # `--maxWorkers=2` is a separate, RESOURCE concern: nine suites hammering the
      # trimmed stack on a constrained runner intermittently drew transient Kong/
      # PostgREST 502s ("invalid response from upstream server"). Capping concurrent
      # files keeps real parallelism while staying under that ceiling. CI-only — local
      # `pnpm test:integration` runs unconstrained.
      - run: pnpm test:integration --maxWorkers=2

      # The whole point of writing the log to a file: a solver that crashed mid-suite would
      # otherwise present only as a vitest timeout with nothing to read.
      - name: Solver service log
        if: failure()
        run: cat "$RUNNER_TEMP/solver.log"

  # Stays Docker-free even though the Worker now declares a container: `dev.enable_containers: false`
  # in `wrangler.jsonc` means `astro preview` never builds or starts an image. The `SOLVER` binding
  # object still exists in the preview, so `getSolverTransport()` returns a BINDING transport here
  # rather than `null` — harmless, because no spec presses Generate (S-306 owns that coverage). If an
  # E2E for Generate is ever added, it needs a solver: either `SOLVER_URL` in the `.dev.vars` written
  # below (pointing at a native service, as the `integration` job does) or a real container.
  e2e:
    name: "E2E tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase-stack
        with:
          export-anon-key: "true"

      # The workerd preview reads SUPABASE_URL/SUPABASE_KEY from `.dev.vars`, NOT from
      # `webServer.env` — and the CI stack mints its own anon key that won't match the
      # fixed local publishable key, so we must write `.dev.vars` from the minted keys
      # before the server boots. Unquoted KEY=value, matching `pnpm env:local` output.
      - name: Write .dev.vars for the workerd preview
        run: printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .dev.vars

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `pretest:e2e` provisions the author (URL + service-role from $GITHUB_ENV) and
      # `test:e2e`'s webServer runs `pnpm build && pnpm preview` on real workerd.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The Python half of the wire-contract gate (F-301). It ships here rather than with the full
  # FR-315 solver lane (S-302) for one reason: without it, "the frozen contract is gated in BOTH
  # suites" would be true locally and false in CI — the exact half-truth the contract exists to
  # prevent. Deliberately minimal: pytest plus ruff, which is already in the dev group and costs no
  # new dependency — a linter that only ever runs when someone remembers to is not a gate.
  # `mypy --strict` landed with F-302 rather than waiting for the full FR-315 lane: the gate had to
  # exist BEFORE the HTTP wrapper was written, so the new module was born under it instead of being
  # retrofitted. It is config-driven (`[tool.mypy]` in pyproject) and covers `src/` and `tests/`.
  #
  # **No path filtering, and S-302 decided that deliberately** — the earlier note here promising it
  # was wrong about the economics. This job runs 44 s; `verify`, `integration`, `e2e` and `solver`
  # carry no `needs:` between them, so they run in parallel and the critical path is `e2e` at 426 s.
  # Filtering a 44 s job out of that saves billed minutes and exactly zero wall clock — while costing
  # a rewrite of `deploy`'s `if:` gate, because a skipped job is not a success and would stop
  # shipping `main`. The `always() && !contains(needs.*.result,'failure')` form that fixes it also
  # switches off the implicit success gate for all four needs at once, on the only job that touches
  # production. `contracts/**` is cross-cutting besides: it is byte-gated here AND in `verify`, so a
  # naive `services/solver/**` filter would skip the Python half of the very gate this job exists to
  # make honest. If deploy wall-clock becomes a problem the lever is GHA Docker layer caching, never
  # path filters.
  solver:
    name: "Solver tests (Python)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/solver
    steps:
      - uses: actions/checkout@v6

      # ortools pins protobuf/numpy tightly, so this package owns a dedicated venv — uv builds it
      # from the committed lockfile. `working-directory` is repeated here because `defaults.run`
      # applies to `run:` steps only, not to an action's own file discovery and cache glob.
      #
      # EXACT version pin, unlike the `@v6`/`@v2` majors elsewhere in this file: astral-sh/setup-uv
      # publishes moving major tags only up to v7, so `@v9` does not resolve ("unable to find version
      # v9"). Bump this deliberately; do not "tidy" it back to a bare major.
      #
      # `version` pins the uv RESOLVER itself — a separate axis from the action tag, and left
      # unpinned it silently floats to latest. It must equal `mise.toml`'s `uv = "..."`, which is
      # what makes "a developer and the gate build the venv with the same resolver" a fact rather
      # than an aspiration. Move the two together.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          working-directory: services/solver

      # `--locked` is the JS side's `--frozen-lockfile`: it fails if uv.lock is stale rather than
      # silently resolving something the lockfile never recorded.
      - run: uv sync --locked
      - run: uv run ruff check
      # Config-driven: files, strictness and mypy_path all live in `[tool.mypy]`, so this command
      # is identical to the local one and cannot drift from it by argument.
      - run: uv run mypy
      - run: uv run pytest

      # The Python mirror of `pnpm audit --audit-level=high` in the verify job. It arrives with
      # F-302 because that is when the surface stopped being trivial: adding the HTTP wrapper took
      # this package from ONE direct dependency (ortools) to a ~50-package resolution, which is the
      # exact moment health-check.md flagged for wiring a scan. `--preview-features audit` is not a
      # tidy-up — `uv audit` is still experimental, and naming the preview keeps a future default
      # flip from changing this step's behaviour silently.
      - run: uv audit --preview-features audit

  deploy:
    name: "Deploy"
    needs: [verify, integration, e2e, solver]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - run: pnpm exec astro sync
      - run: pnpm run build

      # Schema first, then code: migrations are additive by convention, so the
      # live Worker keeps running against the new schema while the deploy finishes.
      - name: Apply Supabase migrations
        run: |
          pnpm exec supabase link --project-ref hwmuiymhjgewtymymbmb
          pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Since S-302 the deploy step below ALSO builds and pushes the solver container image, using
      # the runner's own Docker daemon (`ubuntu-latest` ships Docker 28; `wrangler-action` is a
      # node24 JS action running on the host, not a container action, so the daemon is reachable).
      # This check exists so a missing or broken daemon fails here, with a legible message, instead
      # of two minutes later inside wrangler's image build.
      - name: Verify the Docker daemon (the container image builds during deploy)
        run: |
          docker version
          docker buildx version

      # wranglerVersion pins the action's installed Wrangler to the repo's devDependency
      # (package.json `^4.102.0` → lockfile 4.102.0) so CI deploys with the version the app
      # is built against. Keep in lockstep with the `wrangler` devDependency on bumps.
      #
      # One command, three side effects since S-302: it uploads the Worker, and it builds and pushes
      # `services/solver/Dockerfile` to Cloudflare's registry, and it rolls the container out. The
      # image build runs on EVERY merge to `main` (no path filters — see the `solver` job's note);
      # the layer PUSH stays incremental via registry-side dedup, but the build itself re-runs from
      # scratch on each ephemeral runner. Measure the added wall-clock before optimising; the lever
      # is `cache-from`/`cache-to: type=gha`, not path filters.
      #
      # `CLOUDFLARE_API_TOKEN` needs `Workers Scripts: Edit` AND `Containers: Edit`, both
      # account-scoped. The `Edit Cloudflare Workers` template does NOT include Containers, so it is
      # insufficient on its own. On a 403 mentioning containers, `Cloudchamber: Edit` is the next
      # thing to add (wrangler's own OAuth flow requests both).
      #
      # If the daemon is ever unreachable from the action, the documented fallback is
      # `preCommands: pnpm exec wrangler containers build -p -t …` — do not pre-build in a separate
      # step, which would decouple the image from the config wrangler deploys against.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.102.0"
