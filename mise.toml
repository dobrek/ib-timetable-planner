# Cross-ecosystem toolchain and tasks.
#
# Division of labour, per CLAUDE.md: **pnpm scripts stay the JS-side canon** and no solver step ever
# enters `package.json`. mise owns the Python side — it is the only place a developer can pick up
# the solver's toolchain without knowing that `uv` exists — and it is the front door for the
# cross-ecosystem commands that have no natural home in either package manager.
#
# CI deliberately does NOT run through mise: the `solver` job calls `uv` directly via
# `astral-sh/setup-uv`. That is not duplication to be tidied away — the two paths run the SAME
# underlying commands (`uv run ruff check`, `uv run mypy`, `uv run pytest`), so a drift between the
# developer's front door and the gate shows up as a red build rather than as a local-only green.

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tools]
# The same version both `setup-uv` steps in `.github/workflows/ci.yml` pin via their `version:`
# input. Bump all three together — the point of the pin is that a developer and the gate build the
# venv with the same resolver, not that the number is frozen forever. Python itself is pinned by
# `services/solver/.python-version` (3.13), which uv reads; duplicating it here would create a
# second source of truth for the interpreter.
uv = "0.12.3"

# --- solver (services/solver) ---------------------------------------------------------------------
# ortools pins protobuf/numpy tightly, so this package owns a dedicated venv and every task runs
# from its directory. `uv run` builds/refreshes that venv on demand — no activate step to forget.

[tasks."solver:dev"]
description = "Run the CP-SAT solver service on :8000 (needs the local Supabase stack + a provisioned machine user)"
dir = "{{config_root}}/services/solver"
run = '''
{% raw %}
# Fail fast on a missing credential, at the TASK level.
#
# The service deliberately boots without one — `/health` must answer on a bare container, which is
# what a platform probe hits before secrets are wired — so absence surfaces at the first job. In a
# container that is right. On a developer's machine it is a trap: uvicorn comes up looking healthy
# and every dispatch is refused with a 503 (row → `failed`, clone deleted). Before `solve` learned
# to refuse (2026-08-18) the service TOOK the job and the row wedged at `queued`; measured cost of
# learning that the hard way: one wedged row and a manual DELETE.
#
# So the guard lives here rather than in `settings.py`, where it would break the bare-container
# promise. `solver:image:smoke` carries the same guard for the same reason.
missing=""
if [ -z "${SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL"; fi
if [ -z "${SUPABASE_KEY:-}" ]; then missing="$missing SUPABASE_KEY"; fi
if [ -z "${SOLVER_MACHINE_PASSWORD:-}" ]; then missing="$missing SOLVER_MACHINE_PASSWORD"; fi
if [ -n "$missing" ]; then
  echo "solver:dev is missing:$missing" >&2
  echo >&2
  echo "  set -a; . .envs/local.vars; set +a      # SUPABASE_URL + SUPABASE_KEY" >&2
  echo "  export SOLVER_MACHINE_PASSWORD='...'   # what you gave provision-solver-user.mjs" >&2
  echo >&2
  echo "Starting without these would look healthy, take a real dispatch, and leave the job row" >&2
  echo "stuck at 'queued' with an orphan proposal plan. See README § Running the solver service." >&2
  exit 1
fi
uv run uvicorn cpsat_service.app:app --port 8000
{% endraw %}
'''

[tasks."solver:test"]
description = "Run the solver's pytest suite (engine + contract + HTTP wrapper)"
dir = "{{config_root}}/services/solver"
run = "uv run pytest"

[tasks."solver:check"]
description = "Lint and type-check the solver — the same two gates CI's solver job runs"
dir = "{{config_root}}/services/solver"
run = ["uv run ruff check", "uv run mypy"]

# --- local fidelity tier 2: the container image ----------------------------------------------------
# Tier 1 is `solver:dev` above (native uvicorn + SOLVER_URL). Tier 2 proves the IMAGE — that the
# Dockerfile's layout satisfies `app.py`'s `parents[4]` contract anchor and that the service reaches
# the local stack from inside a container. Both tasks need Docker Desktop running; neither is part
# of `pnpm dev` / `pnpm preview`, which stay Docker-free by design (`dev.enable_containers: false`).
#
# `linux/amd64` is not a preference: `wrangler containers push` rejects anything else. On Apple
# silicon the image therefore RUNS under emulation, which is fine for a correctness smoke and
# WORTHLESS for timing — never quote a solve duration measured here.

[tasks."solver:image:build"]
description = "Build the linux/amd64 solver container image (tier 2) — needs Docker Desktop running"
dir = "{{config_root}}"
run = '''
{% raw %}
set -eu
docker build --platform linux/amd64 -f services/solver/Dockerfile -t ib-solver:local .

# `wrangler containers push` rejects a non-amd64 image outright, and an arm64 build on this machine
# is the easy accident — so the assertion belongs here, not in a reviewer's head.
arch=$(docker image inspect ib-solver:local --format '{{.Architecture}}')
if [ "$arch" != "amd64" ]; then
  echo "ib-solver:local is $arch, not amd64 — 'wrangler containers push' would reject it" >&2
  exit 1
fi
size=$(docker image inspect ib-solver:local --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}')
echo "ib-solver:local  arch=$arch  size=$size"
{% endraw %}
'''

[tasks."solver:image:smoke"]
description = "Smoke the tier-2 image: boot it against the local stack and POST a golden SolveRequest, asserting 202"
dir = "{{config_root}}"
run = '''
{% raw %}
set -eu

# A `/health` probe is NOT sufficient here, and that is the whole point of this task. The contract
# validator fails OPEN (`app.py:_build_validator` returns None when `contracts/` is missing), so a
# wrong image layout leaves `/health` green while every solve 500s. Only a real `SolveRequest` body
# tells the two apart.
image=ib-solver:local
container=ib-solver-smoke
job_id="${SMOKE_JOB_ID:-11111111-2222-4333-8444-555555555555}"

if [ -z "${SOLVER_MACHINE_PASSWORD:-}" ]; then
  echo "SOLVER_MACHINE_PASSWORD is unset. The container signs in at STARTUP, so it would exit" >&2
  echo "before binding :8000 rather than failing later. Export the password you provisioned with" >&2
  echo "scripts/provision-solver-user.mjs — the same way 'mise run solver:dev' gets it." >&2
  exit 1
fi

supabase_key="${SUPABASE_KEY:-}"
if [ -z "$supabase_key" ] && [ -f .envs/local.vars ]; then
  supabase_key=$(sed -n 's/^SUPABASE_KEY=//p' .envs/local.vars | head -1)
fi
if [ -z "$supabase_key" ]; then
  echo "No SUPABASE_KEY in the environment and none readable from .envs/local.vars." >&2
  echo "Export the local stack's PUBLISHABLE key (never the secret key)." >&2
  exit 1
fi

docker image inspect "$image" >/dev/null 2>&1 || {
  echo "$image does not exist — run 'mise run solver:image:build' first." >&2
  exit 1
}

docker rm -f "$container" >/dev/null 2>&1 || true
cleanup() {
  echo "--- container log -----------------------------------------------------------------"
  docker logs "$container" 2>&1 || true
  echo "-----------------------------------------------------------------------------------"
  docker rm -f "$container" >/dev/null 2>&1 || true
}
trap cleanup EXIT

# `host.docker.internal` is how the container reaches the stack on the HOST; `--add-host` makes the
# name resolve on engines that do not provide it for free. The env trio is exactly what production
# forwards through the Container class's `envVars` — no secret key, no service-role key.
docker run -d --name "$container" \
  --platform linux/amd64 \
  --add-host host.docker.internal:host-gateway \
  -p 8000:8000 \
  -e SUPABASE_URL=http://host.docker.internal:54321 \
  -e SUPABASE_KEY="$supabase_key" \
  -e SOLVER_MACHINE_PASSWORD="$SOLVER_MACHINE_PASSWORD" \
  -e SOLVER_WORKERS=4 \
  -e SOLVER_MAX_CONCURRENT_JOBS=1 \
  -e SOLVER_LOG_LEVEL=INFO \
  "$image" >/dev/null

waited=0
until curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; do
  if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
    echo "the container exited before binding :8000 — a FAILED STARTUP CREDENTIAL CHECK looks" >&2
    echo "exactly like this. Is the local Supabase stack up, and the machine user provisioned?" >&2
    exit 1
  fi
  waited=$((waited + 1))
  if [ "$waited" -gt 90 ]; then
    echo "the container never answered /health within 90s" >&2
    exit 1
  fi
  sleep 1
done
echo "/health is up after ${waited}s"

body=$(mktemp)
code=$(curl -s -o "$body" -w '%{http_code}' -X POST \
  -H 'Content-Type: application/json' \
  --data-binary @contracts/fixtures/solve-request.json \
  "http://127.0.0.1:8000/jobs/$job_id/solve")

if [ "$code" = "500" ]; then
  echo "500 on a KNOWN-VALID golden body — this is the contracts/ layout trap." >&2
  echo "The image must preserve <root>/services/solver/src/... beside <root>/contracts/ so that" >&2
  echo "app.py's parents[4] anchor resolves. Response body:" >&2
  cat "$body" >&2
  rm -f "$body"
  exit 1
fi
if [ "$code" != "202" ]; then
  echo "expected 202 from the golden SolveRequest, got $code:" >&2
  cat "$body" >&2
  rm -f "$body"
  exit 1
fi
rm -f "$body"
echo "202 accepted for job $job_id — the wire contract resolved inside the image"
echo
echo "With a job id that has no queued row the worker logs 'not claimable' and stops: that is the"
echo "expected smoke outcome. Set SMOKE_JOB_ID to a real queued row to watch a full advance."
{% endraw %}
'''

# --- local fidelity tier 3 + the hosted-solve campaign ---------------------------------------------

[tasks."solver:tier3"]
description = "Tier 3: run the REAL container inside local workerd (needs Docker Desktop) — opt-in, not the daily loop"
dir = "{{config_root}}"
run = '''
{% raw %}
set -eu

# Tier 3 exists to exercise the one path the other tiers cannot: `getSolverTransport()` choosing the
# BINDING, `SolverContainer` starting a real container, and `containerFetch` crossing Workers RPC.
# Tiers 1 and 2 both dispatch over a URL, so neither touches any of that.
#
# **The ordering below is load-bearing.** `astro build` snapshots the root `.dev.vars` into
# `dist/server/.dev.vars`, and the redirected `wrangler dev` reads THAT copy — so `SOLVER_URL` must
# be removed BEFORE the build. Writing it after would leave the URL transport quietly in charge, and
# this task would prove nothing while looking like it passed.
#
# Verified 2026-08-17: `wrangler dev` honours `.wrangler/deploy/config.json`, so it picks up the
# generated `dist/server/wrangler.json` (containers and all), and the hidden `--enable-containers`
# flag overrides the committed `dev.enable_containers: false` for this session only — no edit to
# `wrangler.jsonc` required.
if ! docker version >/dev/null 2>&1; then
  echo "Docker Desktop is not running — tier 3 starts a real container." >&2
  exit 1
fi

# `wrangler dev` builds the Worker's `env` from `.dev.vars` — NOT from this shell. So exporting the
# password is not enough: it has to be written into the file the Worker reads, or `SolverContainer`
# forwards an empty string and the container boots UNCONFIGURED (the service must answer `/health`
# on a bare container, so the startup check skips itself when the trio is absent): the container
# comes up and refuses every dispatch with a 503, so tier 3 proves nothing. Checked before the
# build, which costs a minute.
if [ -z "${SOLVER_MACHINE_PASSWORD:-}" ]; then
  echo "SOLVER_MACHINE_PASSWORD is unset, and tier 3 needs it in .dev.vars for the WORKER to" >&2
  echo "forward into the container. Without it the container boots unconfigured and refuses" >&2
  echo "every dispatch with a 503." >&2
  echo >&2
  echo "  export SOLVER_MACHINE_PASSWORD='...'   # what you gave provision-solver-user.mjs" >&2
  exit 1
fi

trap 'echo; echo "restoring .dev.vars (SOLVER_URL back in charge, injected secrets dropped)"; pnpm env:local >/dev/null' EXIT INT TERM

# Three edits, all before the build:
#
#   1. drop SOLVER_URL, so `getSolverTransport()` falls through to the binding;
#   2. add SOLVER_SUPABASE_URL, because the Worker and the container need DIFFERENT Supabase URLs.
#      The Worker runs on the host and reaches the stack at 127.0.0.1; inside the container that is
#      the container's own loopback, and every request is refused;
#   3. add SOLVER_MACHINE_PASSWORD, which in production is a Worker secret set by `wrangler secret
#      put` and locally has nowhere else to come from.
#
# Keys 2 and 3 are inert in production: no such Worker secret exists there. Both are written to
# `.dev.vars` (gitignored) and dropped again by the trap's `pnpm env:local`; the build's copy under
# `dist/server/` is gitignored too and is overwritten by the next build.
echo "rewriting .dev.vars for the binding path, then rebuilding (the build snapshots it)"
grep -v -e '^SOLVER_URL=' -e '^SOLVER_SUPABASE_URL=' -e '^SOLVER_MACHINE_PASSWORD=' .dev.vars > .dev.vars.tier3 || true
container_url=$(sed -n 's/^SUPABASE_URL=//p' .dev.vars | head -1 \
  | sed -e 's#//127\.0\.0\.1:#//host.docker.internal:#' -e 's#//localhost:#//host.docker.internal:#')
case "$container_url" in
  *host.docker.internal*) echo "SOLVER_SUPABASE_URL=$container_url" >> .dev.vars.tier3 ;;
  *) echo "note: SUPABASE_URL is not local, so the container can use it unchanged" ;;
esac
# Written single-quoted, because `.dev.vars` is dotenv: an UNQUOTED value is cut at the first `#`,
# and a double-quoted one has `\n` expanded. Single quotes are literal - except that dotenv never
# unescapes a `'` inside them, so a password containing one cannot be represented; refuse it
# (and a newline) rather than hand the Worker a truncated secret it would forward silently.
case "$SOLVER_MACHINE_PASSWORD" in *\'*) pw_unrepresentable=1 ;; *) pw_unrepresentable=0 ;; esac
if [ "$(printf '%s' "$SOLVER_MACHINE_PASSWORD" | wc -l)" -gt 0 ]; then pw_unrepresentable=1; fi
if [ "$pw_unrepresentable" -eq 1 ]; then
  echo "SOLVER_MACHINE_PASSWORD contains a single quote or a newline, which .dev.vars cannot" >&2
  echo "carry literally. Provision the local machine user with a password free of both." >&2
  rm -f .dev.vars.tier3
  exit 1
fi
echo "SOLVER_MACHINE_PASSWORD='$SOLVER_MACHINE_PASSWORD'" >> .dev.vars.tier3
mv .dev.vars.tier3 .dev.vars
pnpm build

echo
echo "starting workerd with the real container on ${TIER3_PORT:-8787}"
echo "Hit Generate on a local plan; the POST should appear in the solver container's docker logs."
echo "Ctrl-C restores .dev.vars via pnpm env:local."
echo
pnpm exec wrangler dev --enable-containers --port "${TIER3_PORT:-8787}"
{% endraw %}
'''

[tasks."solver:hosted"]
description = "Hosted-solve campaign: local app + NATIVE solver against the HOSTED database (writes to production)"
dir = "{{config_root}}"
run = '''
{% raw %}
set -eu

profile=.envs/prod-solver.vars

if [ ! -f "$profile" ]; then
  echo "$profile does not exist. It is gitignored and per-machine — create it with:" >&2
  echo >&2
  echo "  SUPABASE_URL=https://<project-ref>.supabase.co" >&2
  echo "  SUPABASE_KEY=<hosted PUBLISHABLE key>" >&2
  echo "  SOLVER_URL=http://127.0.0.1:8000" >&2
  echo "  SOLVER_MACHINE_PASSWORD=<hosted machine user password>" >&2
  echo >&2
  echo "See README § Environment Profiles. Hosted enablement must be done first (S-302 Phase 6)." >&2
  exit 1
fi

missing=""
for key in SUPABASE_URL SUPABASE_KEY SOLVER_URL SOLVER_MACHINE_PASSWORD; do
  grep -q "^$key=" "$profile" || missing="$missing $key"
done
if [ -n "$missing" ]; then
  echo "$profile is missing:$missing" >&2
  exit 1
fi

# :8000 must be OURS. If a tier-1 `solver:dev` (pointed at the LOCAL stack) already holds the port,
# the hosted uvicorn fails to bind and exits, the /health wait below passes against the wrong
# process, and every Generate then inserts a HOSTED job row + clone that the local solver cannot
# claim - production rows wedged at `queued`. Refuse up front rather than discover it in the data.
if lsof -nP -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1; then
  echo "something is already listening on :8000 (a running 'mise run solver:dev'?)." >&2
  echo "The campaign must own that port, or the app would dispatch HOSTED jobs to it. Stop it first:" >&2
  lsof -nP -iTCP:8000 -sTCP:LISTEN >&2 || true
  exit 1
fi

echo "############################################################################"
echo "#  HOSTED-SOLVE CAMPAIGN - THIS WRITES TO PRODUCTION                       #"
echo "############################################################################"
echo "#  Generation is not read-only. This run will, on the HOSTED database:     #"
echo "#    * insert generation_jobs rows                                         #"
echo "#    * call clone_plan, creating real proposal plans that accumulate       #"
echo "#    * apply placements on delivery                                        #"
echo "#                                                                          #"
echo "#  DO NOT LET THIS MACHINE SLEEP. The claim CAS filters status=eq.queued,  #"
echo "#  so a solve interrupted mid-flight leaves a PRODUCTION row stuck at      #"
echo "#  'running', unclaimable until S-304 widens it - recovery today is manual #"
echo "#  SQL against hosted. caffeinate -i is used below, but it cannot survive  #"
echo "#  a lid close or a flat battery.                                          #"
echo "#                                                                          #"
echo "#  TIMING MEASURED HERE IS INVALID (M-series, 8 workers vs the container's #"
echo "#  4). Board QUALITY and policy comparisons are legitimate.                #"
echo "############################################################################"
echo

if [ "${SOLVER_HOSTED_CONFIRM:-}" != "yes" ]; then
  printf "Type 'hosted' to continue: "
  read -r answer
  if [ "$answer" != "hosted" ]; then
    echo "aborted - nothing was changed." >&2
    exit 1
  fi
fi

cleanup() {
  echo
  echo "stopping the solver and restoring the local profile"
  if [ -n "${SOLVER_PID:-}" ]; then
    pkill -P "$SOLVER_PID" 2>/dev/null || true
    kill "$SOLVER_PID" 2>/dev/null || true
  fi
  pnpm env:local >/dev/null
  echo "back on .envs/local.vars - rebuild before the next pnpm preview"
}
trap cleanup EXIT INT TERM

pnpm env:prod-solver

# The solver reads the trio from ITS OWN environment, so the profile is read here rather than
# relying on the .env.local copy - `astro:env` feeds the app, never this process. READ, not
# sourced: the file is dotenv (bare literal values, as `.dev.vars` and `.env.local` will parse
# it), and executing it as shell would make a password carrying `$`, `;` or a backtick either
# mangled or run. `solver:image:smoke` reads its keys the same way. `caffeinate -i` keeps the
# machine awake for the whole solve; a sleeping laptop is the sharpest risk of this mode.
profile_value() {
  sed -n "s/^$1=//p" "$profile" | head -1 | sed -e "s/^'\(.*\)'\$/\1/" -e 's/^"\(.*\)"$/\1/'
}
solver_supabase_url=$(profile_value SUPABASE_URL)
solver_supabase_key=$(profile_value SUPABASE_KEY)
solver_machine_password=$(profile_value SOLVER_MACHINE_PASSWORD)

echo "starting the native solver against HOSTED Supabase"
if [ "$(uname)" = "Darwin" ]; then
  ( cd services/solver && SUPABASE_URL="$solver_supabase_url" SUPABASE_KEY="$solver_supabase_key" \
      SOLVER_MACHINE_PASSWORD="$solver_machine_password" \
      caffeinate -i uv run uvicorn cpsat_service.app:app --port 8000 ) &
else
  ( cd services/solver && SUPABASE_URL="$solver_supabase_url" SUPABASE_KEY="$solver_supabase_key" \
      SOLVER_MACHINE_PASSWORD="$solver_machine_password" \
      uv run uvicorn cpsat_service.app:app --port 8000 ) &
fi
SOLVER_PID=$!

waited=0
until curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; do
  # Liveness first: a solver that died (failed startup credential check, port taken after our
  # check) must not leave us polling until something ELSE answers on :8000.
  if ! kill -0 "$SOLVER_PID" 2>/dev/null; then
    echo "the solver process exited before answering /health - a failed startup credential check" >&2
    echo "looks like this. Is the hosted Custom Access Token Hook enabled and the machine user provisioned?" >&2
    exit 1
  fi
  waited=$((waited + 1))
  if [ "$waited" -gt 60 ]; then
    echo "the solver never answered /health within 60 s." >&2
    exit 1
  fi
  sleep 1
done
echo "solver is up and its startup credential check passed"

pnpm build
pnpm preview
{% endraw %}
'''
