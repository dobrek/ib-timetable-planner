[project]
name = "cpsat-engine"
version = "0.1.0"
description = "Local CP-SAT solver POC for IB timetable generation, shaped as a future backend-service core."
requires-python = ">=3.12"
dependencies = [
  # ortools pins protobuf/numpy tightly — this project owns a dedicated uv venv, never a shared one.
  "ortools>=9.15,<9.16",
]

[project.scripts]
cpsat = "cpsat_engine.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  # Wire-contract validation is a TEST-LANE concern only: the frozen schema in `contracts/` gates
  # the goldens here, and nothing validates inside the solve path (see contracts/README.md).
  "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsat_engine"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
