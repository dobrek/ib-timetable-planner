<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>IB Timetable Planner</title>

  <!-- Tile — neutral dark, matches dark-mode background -->
  <rect width="64" height="64" rx="8" fill="#1c1c1c" />

  <!-- 2-cohort × 3-period timetable grid -->

  <!-- Left column (dp1) -->
  <rect x="9"  y="9"  width="20" height="12" rx="2" fill="#38bdf8" />
  <rect x="9"  y="26" width="20" height="12" rx="2" fill="white" fill-opacity="0.06" />
  <rect x="9"  y="43" width="20" height="12" rx="2" fill="#34d399" />

  <!-- Right column (dp2) -->
  <rect x="35" y="9"  width="20" height="12" rx="2" fill="white" fill-opacity="0.06" />
  <rect x="35" y="26" width="20" height="12" rx="2" fill="#fbbf24" />
  <rect x="35" y="43" width="20" height="12" rx="2" fill="#a78bfa" />
</svg>
