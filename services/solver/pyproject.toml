[project]
name = "cpsat-engine"
version = "0.1.0"
description = "CP-SAT solver service for IB timetable generation: a pure engine plus a thin HTTP wrapper."
requires-python = ">=3.13"
dependencies = [
  # ortools pins protobuf/numpy tightly — this project owns a dedicated uv venv, never a shared one.
  "ortools>=9.15,<9.16",
  # The `cpsat_service` HTTP wrapper. `cpsat_engine` imports none of these — the engine stays
  # transport-agnostic and the service depends on the engine, never the reverse.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  # The ONLY Supabase client: the runbook settles that httpx alone suffices, which matters because
  # the SDK would drag a second resolution pass across the ortools protobuf/numpy pins.
  "httpx>=0.28",
  # RUNTIME, not test-lane. F-302 deliberately inverts the old "TEST-LANE concern only" note below:
  # the wrapper accepts arbitrary HTTP JSON and the engine does raw dict access (a malformed body
  # would raise a bare KeyError), so the boundary MUST validate — and it validates against
  # `contracts/generation-wire.schema.json` itself rather than a hand-written Pydantic projection,
  # which would be a third projection of a document owned by neither side, free to drift from both.
  "jsonschema>=4",
]

[project.scripts]
cpsat = "cpsat_engine.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.14",
  # TEST-LANE ONLY, and not interchangeable with the runtime `httpx` above: starlette's TestClient
  # drives itself through httpx2 and warns (soon: fails) when only httpx 0.x is present. The service
  # deliberately stays on `httpx`, which is the client the runbook settled on and the one the
  # ortools pins were verified against — this dependency buys the test harness, nothing else.
  "httpx2>=2",
  # jsonschema ships no inline types; without this stub package `--strict` reports the whole
  # contract test module as untyped rather than checking it.
  "types-jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsat_engine", "src/cpsat_service"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# CLAUDE.md's standing rule: all solver code stays fully type-annotated, with `--strict` as the gate.
# Config-driven so `uv run mypy` (no args) is the whole command, in CI and locally alike.
#
# `tests/` is inside the gate, not beside it: the wrapper suite is the surface FR-310 singles out,
# and a strict `src/` with untyped tests would let the tests drift into exactly the shape the gate
# exists to prevent. `mypy_path` mirrors pytest's `pythonpath` — the package is not installed into
# the venv's site-packages as a real distribution during a checkout run, so tests resolve
# `cpsat_engine` only via the source tree.
[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
